name: Toot
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  workflow_dispatch:
  schedule:
    # 每天北京时间早晨8点
    - cron: "0 0 * * *"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        env:
          UV_PYTHON_PREFERENCE: only-managed
        with:
          python-version: "3.11"
          activate-environment: true
          cache-dependency-glob: pdm.lock
      - name: Install
        run: |
          uv tool install pdm
          pdm sync --prod
      - name: Toot
        run: |
          pdm run python src/mastodon_bot
        env:
          MSTDN_ACCESS_TOKEN: ${{ secrets.MSTDN_ACCESS_TOKEN }}
          MSTDN_API_BASE_URL: https://mastodon.online/
      - name: Commit files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # The commit message for the commit.
          commit_message: "Update last sent"
          commit_author: Author <actions@github.com>
